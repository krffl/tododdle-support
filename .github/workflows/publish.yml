name: Publish npm packages

# Publishes @krffl/tododdle-support and @krffl/tododdle-support-react-native with npm trusted
# publishing (OIDC). Create a GitHub release with the tag v<VERSION>, for example v1.0.0.
# Pre-release versions such as 1.1.0-beta.1 publish under the `next` dist-tag.
#
# Two jobs: `build` installs dependencies, runs every check and packs the tarballs with read-only
# permissions. `publish` gets the OIDC token, but never installs or runs package code: it only
# publishes the tarballs that `build` made.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The release tag is not on origin/main. Publish only from main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match VERSION ${VERSION}." >&2
            exit 1
          fi
          npm run check:version
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "${VERSION}" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify packages
        run: |
          npm run check:generated
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm audit --omit=dev --audit-level=low

      - name: Pack packages
        run: |
          mkdir -p packed
          npm pack --workspace @krffl/tododdle-support --pack-destination packed
          npm pack --workspace @krffl/tododdle-support-react-native --pack-destination packed
          ls -l packed

      - name: Upload tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs
          path: packed/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarballs
          path: packed

      - name: Publish packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          # The core first: the React Native package depends on this exact version.
          npm publish "./packed/krffl-tododdle-support-${VERSION}.tgz" --tag "${DIST_TAG}"
          npm publish "./packed/krffl-tododdle-support-react-native-${VERSION}.tgz" --tag "${DIST_TAG}"
