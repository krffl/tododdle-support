name: Publish npm packages

# Publishes @krffl/tododdle-support and @krffl/tododdle-support-react-native with npm trusted
# publishing (OIDC). Create a GitHub release with the tag v<VERSION>, for example v1.0.0.
# Pre-release versions such as 1.1.0-beta.1 publish under the `next` dist-tag.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match VERSION ${VERSION}." >&2
            exit 1
          fi
          npm run check:version
          case "${VERSION}" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify packages
        run: |
          npm run check:generated
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm audit --omit=dev --audit-level=low
          npm pack --dry-run --workspaces

      - name: Publish packages
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          # The core first: the React Native package depends on this exact version.
          npm publish --workspace @krffl/tododdle-support --tag "${DIST_TAG}"
          npm publish --workspace @krffl/tododdle-support-react-native --tag "${DIST_TAG}"
