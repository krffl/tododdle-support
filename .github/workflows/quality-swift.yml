name: Quality (Swift)

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'VERSION'
      - 'contract/**'
      - 'swift/**'
      - 'scripts/sync-swift-*.sh'
      - '.github/workflows/quality-swift.yml'
  pull_request:
    paths:
      - 'Package.swift'
      - 'VERSION'
      - 'contract/**'
      - 'swift/**'
      - 'scripts/sync-swift-*.sh'
      - '.github/workflows/quality-swift.yml'

permissions:
  contents: read

concurrency:
  group: quality-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check the conformance cases copy
        run: scripts/sync-swift-cases.sh --check

      - name: Run tests (macOS)
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme TododdleSupport \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_SWIFT_FLAGS='-warnings-as-errors'
