name: Quality (Kotlin)

on:
  push:
    branches: [main]
    paths:
      - 'kotlin/**'
      - 'contract/**'
      - 'VERSION'
      - 'jitpack.yml'
      - '.github/workflows/quality-kotlin.yml'
  pull_request:
    paths:
      - 'kotlin/**'
      - 'contract/**'
      - 'VERSION'
      - 'jitpack.yml'
      - '.github/workflows/quality-kotlin.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit and conformance tests
        run: ./gradlew --no-daemon test

      - name: Build the release libraries
        run: ./gradlew --no-daemon assembleRelease
